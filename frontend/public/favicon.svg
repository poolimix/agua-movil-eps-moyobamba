  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  
  <!-- Inner Glow Circle -->
  <circle cx="256" cy="256" r="210" fill="url(#bgGrad)" filter="url(#shadow)" opacity="0.35" />

