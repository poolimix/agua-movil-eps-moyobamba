<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f223f" />
      <stop offset="100%" stop-color="#081026" />
    </linearGradient>

    <!-- Outer Glow Border -->
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Water Drop Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="35%" stop-color="#0ea5e9" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Pin Radar Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Rounded Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#glowBorder)" stroke-width="6" filter="url(#shadow)" />

  <!-- Radar Pulse Rings -->
  <circle cx="256" cy="275" r="185" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.45" />
  <circle cx="256" cy="275" r="150" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.3" />

  <!-- Water Drop Silhouette (Agua) -->
  <path d="M 256,65 C 256,65 142,225 142,328 C 142,392 193,444 256,444 C 319,444 370,392 370,328 C 370,225 256,65 256,65 Z"
        fill="url(#dropGrad)"
        filter="url(#shadow)"
        stroke="#e0f2fe"
        stroke-width="3.5"
        stroke-linejoin="round" />

  <!-- Droplet Gloss Reflection -->
  <path d="M 205,170 C 190,205 170,265 170,315 C 170,340 180,355 190,355 C 198,355 194,335 194,310 C 194,260 215,205 220,185 C 223,176 210,162 205,170 Z"
        fill="#ffffff"
        opacity="0.55" />

  <!-- Camion Cisterna (Tracking / Distribucion) -->
  <g transform="translate(186, 260) scale(0.68)" filter="url(#shadow)">
    <!-- Chassis & Cabina -->
    <path d="M 0,90 L 0,38 C 0,30 6,24 14,24 L 40,24 C 48,24 55,30 58,38 L 74,75 L 180,75 L 180,95 L 0,95 Z" fill="#ffffff" />
    <!-- Ventana cabina -->
    <path d="M 16,36 L 38,36 C 43,36 47,40 49,45 L 56,62 L 16,62 Z" fill="#0369a1" />
    
    <!-- Tanque Cisterna -->
    <rect x="70" y="8" width="136" height="74" rx="28" fill="#ffffff" stroke="#bae6fd" stroke-width="2" />
    <path d="M 90,20 L 186,20 C 194,20 198,24 198,32 L 198,58 C 198,66 194,70 186,70 L 90,70" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    
    <!-- Tapa de escotilla superior cisterna -->
    <rect x="124" y="0" width="28" height="9" rx="4" fill="#ffffff" />

    <!-- Ruedas -->
    <!-- Rueda Delantera -->
    <circle cx="34" cy="98" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
    <circle cx="34" cy="98" r="8" fill="#ffffff" />
    <!-- Ruedas Traseras Duales -->
    <circle cx="120" cy="98" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
    <circle cx="120" cy="98" r="8" fill="#ffffff" />
    <circle cx="162" cy="98" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
    <circle cx="162" cy="98" r="8" fill="#ffffff" />

    <!-- QR Code Pattern Nodes on Tanker -->
    <!-- Mini QR marker 1 -->
    <rect x="88" y="28" width="16" height="16" fill="#0284c7" rx="2" />
    <rect x="92" y="32" width="8" height="8" fill="#ffffff" />
    <!-- Mini QR marker 2 -->
    <rect x="88" y="48" width="16" height="16" fill="#0284c7" rx="2" />
    <rect x="92" y="52" width="8" height="8" fill="#ffffff" />
    <!-- Circuit Connection Link (Tracking) -->
    <line x1="108" y1="36" x2="140" y2="36" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
    <circle cx="140" cy="36" r="4.5" fill="#0284c7" />
    <line x1="108" y1="56" x2="130" y2="56" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
    <circle cx="130" cy="56" r="4.5" fill="#0284c7" />
  </g>

  <!-- GPS Pin Locator (Tracking Trazabilidad) -->
  <g transform="translate(256, 205)" filter="url(#neonGlow)">
    <!-- Radar Waves below pin -->
    <ellipse cx="0" cy="22" rx="26" ry="7" fill="none" stroke="#e0f2fe" stroke-width="2.5" opacity="0.85" />
    <ellipse cx="0" cy="22" rx="42" ry="11" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.6" stroke-dasharray="4 4" />

    <!-- Pin Body -->
    <path d="M 0,-40 C -18,-40 -32,-26 -32,-8 C -32,14 0,38 0,38 C 0,38 32,14 32,-8 C 32,-26 18,-40 0,-40 Z"
          fill="#ffffff"
          stroke="#0284c7"
          stroke-width="3" />
    <!-- Pin Core Icon -->
    <circle cx="0" cy="-10" r="10" fill="#0284c7" />
    <circle cx="0" cy="-10" r="4" fill="#ffffff" />
  </g>

  <!-- Digital Wave Base -->
  <path d="M 180,410 Q 256,430 332,410" fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />
</svg>