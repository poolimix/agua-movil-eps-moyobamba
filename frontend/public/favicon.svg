  <!-- Highlight Reflection -->
  <path d="M210 200 C200 230 180 280 180 320 C180 340 190 355 198 355 C205 355 200 335 200 310 C200 260 220 220 226 205 C228 200 213 192 210 200 Z" fill="#ffffff" opacity="0.6" />

